# Optional: lets Klipper macros heat to the right temperature for each tool's spool.
# Copy to ~/printer_data/config/ and add [include lanebridge_temps.cfg] to printer.cfg.
#
# lanebridge keeps t0, t1, ... set to the nozzle temperature of the spool assigned to that
# tool (from the filament's settings in Spoolman; 0 = unknown). Read it in a macro with:
#   {% set spool_temp = printer['gcode_macro _LANE_TEMPS']['t' ~ tool_nr]|default(0)|int %}
# Add a variable for every tool you have.

[gcode_macro _LANE_TEMPS]
description: Nozzle temperature of the spool assigned to each tool, set by lanebridge (0 = unknown)
variable_t0: 0
variable_t1: 0
variable_t2: 0
variable_t3: 0
gcode:
  RESPOND MSG="Spool temperatures: T0 {t0} / T1 {t1} / T2 {t2} / T3 {t3} (0 = unknown)"
